# One-off helper: copies every file of the old Neocities site into legacy-neocities/
# so the migration works from the exact published version. Runs when
# .github/mirror-request changes.
name: Mirror Neocities snapshot

on:
  push:
    paths: ['.github/mirror-request']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the published files
        run: |
          mkdir -p legacy-neocities && cd legacy-neocities
          base="https://lqcorner.neocities.org"
          files="index.html professional.html fun.html not_found.html style.css robots.txt
                 favicon.png cat.gif computer.gif smiley.gif hubble.jpg
                 cursor-arrow.png cursor-hand.png cursor-hand-click.png cursor-wait.png cursor-move.png
                 cursor-no.png cursor-text.png cursor-zoom-in.png cursor-zoom-out.png
                 icon-back.png icon-code.png icon-cv.png icon-dashboard.png icon-doc.png icon-folder.png
                 icon-github.png icon-globe.png icon-music.png icon-readme.png icon-thesis.png icon-user.png
                 acu.png bar-energy.png bar-radial.png bar-snapshots.png confmax.png gal.png
                 hist4.png hist5.png hist_comparacion.png mw-dbscan.png mw-density.png mw-rotation.png
                 mw-vector.png output_0052.png output_0052_2.png output_0100.png output_0100_2.png
                 CV_2026_lq.pdf"
          for f in $files; do
            curl -fsSL "$base/$f" -o "$f" && echo "ok $f" || echo "MISSING $f"
          done
          curl -fsSL "$base/Pasted%20image.png" -o "pasted-image.png" && echo "ok pasted-image.png" || echo "MISSING Pasted image.png"
          ls -la
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-neocities
          git commit -m "Snapshot of lqcorner.neocities.org for the migration" || echo "Nothing new to commit"
          git push
