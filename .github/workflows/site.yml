name: site

# Every push runs the checks. Only a push to main whose checks pass is
# published, so a broken link or a card out of sync never reaches the web.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: projects.json is valid and the pages match it
        run: python tools/build_site.py --check
      - name: Links, images, markup and content rules
        run: python -m pytest -q tests

  deploy:
    name: Publish to GitHub Pages
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Collect the files that make up the site
        run: |
          mkdir _site
          cp -r *.html favicon.png robots.txt sitemap.xml projects.json .nojekyll assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
