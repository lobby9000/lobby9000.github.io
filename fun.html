<style>
/* =========================================================
   1. BASE
   Paleta del sitio: crema #F3EFD0 sobre negro #0B0B0B,
   mas el amarillo de obra #F7C543 como unico acento.
   ========================================================= */
:root{
  --ink:#0B0B0B;
  --cream:#F3EFD0;
  --hazard:#F7C543;
  --rust:#C4463A;
  --dim:#8C8770;
}

*{box-sizing:border-box}

html,body{margin:0;padding:0}

body{
  background:var(--ink);
  background-image:
    linear-gradient(rgba(243,239,208,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(243,239,208,.045) 1px, transparent 1px);
  background-size:8px 8px, 8px 8px;
  color:var(--cream);
  font-family:'VT323', 'Courier New', monospace;
  font-size:21px;
  line-height:1.35;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:18px 12px 40px;
  cursor:url('assets/ui/cursors/cursor-arrow.png') 2 2, default;
}

a{color:var(--hazard);text-decoration:none;border-bottom:1px dotted var(--hazard)}
a:hover,a:focus{background:var(--hazard);color:var(--ink);border-bottom-color:transparent}
a:focus-visible,button:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

/* =========================================================
   2. LA VENTANA
   Barra de titulo negra, cinta de obra, y el lienzo dentro.
   ========================================================= */
.window{
  width:100%;
  max-width:1030px;
  border:3px solid var(--cream);
  background:var(--ink);
  box-shadow:10px 10px 0 rgba(243,239,208,.13);
}

.titlebar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--cream);
  color:var(--ink);
  padding:7px 10px;
  font-family:'Press Start 2P', monospace;
  font-size:10px;
  letter-spacing:.5px;
}
.titlebar .dots{letter-spacing:2px}

.tape{
  height:10px;
  background:repeating-linear-gradient(45deg,
    var(--hazard) 0 8px, var(--ink) 8px 16px);
  border-top:1px solid var(--ink);
  border-bottom:2px solid var(--ink);
  background-size:22.6px 22.6px;
  animation:crawl 1.4s linear infinite;
}
@keyframes crawl{from{background-position:0 0}to{background-position:22.6px 0}}

/* El lienzo trabaja a 256x144 pixeles reales y se estira
   con nearest neighbor: nada se ve borroso. */
.screen{display:block;width:100%;height:auto;aspect-ratio:16/9;
  image-rendering:pixelated;image-rendering:crisp-edges;
  background:#1C6B78;
  cursor:url('assets/ui/cursors/cursor-hand.png') 8 4, pointer;
}

/* =========================================================
   3. HUD: barra de avance falsa y lectura de estado
   ========================================================= */
.hud{padding:12px 14px 4px;border-top:2px solid var(--cream)}

.bar{
  height:16px;
  border:2px solid var(--cream);
  background:var(--ink);
  padding:2px;
}
.bar span{
  display:block;height:100%;width:3%;
  background:repeating-linear-gradient(45deg,
    var(--hazard) 0 4px, #B98F1E 4px 8px);
  transition:width .5s steps(8);
}

.readout{margin:8px 0 0;color:var(--dim);min-height:1.35em}
.readout b{color:var(--cream);font-weight:normal}

.statusbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding:10px 14px 12px;
}
.statusbar .spacer{flex:1 1 auto}

button{
  font-family:'Press Start 2P', monospace;
  font-size:9px;
  color:var(--cream);
  background:var(--ink);
  border:2px solid var(--cream);
  padding:9px 11px;
  cursor:url('assets/ui/cursors/cursor-hand.png') 8 4, pointer;
}
button:hover{background:var(--cream);color:var(--ink)}
button[aria-pressed="true"]{background:var(--hazard);color:var(--ink);border-color:var(--hazard)}

.count{color:var(--dim);font-size:19px}

/* =========================================================
   4. TEXTO DE LA PAGINA
   ========================================================= */
.copy{width:100%;max-width:1030px;margin:22px 0 0}
.copy h1{
  font-family:'Press Start 2P', monospace;
  font-size:13px;line-height:1.7;margin:0 0 12px;color:var(--hazard);
}
.copy p{margin:0 0 12px;max-width:62ch}
.copy .exits{margin-top:18px;border-top:1px dotted #3a382f;padding-top:12px}
.copy .exits a{margin-right:18px}

@media (max-width:620px){
  body{font-size:19px;padding:12px 8px 28px}
  .titlebar{font-size:8px}
  .copy h1{font-size:11px}
}

@media (prefers-reduced-motion: reduce){
  .tape{animation:none}
  .bar span{transition:none}
}
</style>
</head>

/* ------------------------------------------------- 4. UTILIDADES */

/* Numeros aleatorios con semilla: el suelo se ve igual cada visita. */
function rngFrom(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function px(c, x, y, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, 1, 1); }
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); }

function line(c, x0, y0, x1, y1, col) {
  var n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)), i, t;
  for (i = 0; i <= n; i++) {
    t = n ? i / n : 0;
    px(c, Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), col);
  }
}

/* Convierte un sprite de texto en un canvas propio (se hace una vez). */
function bake(rows, swap) {
  var h = rows.length, w = rows[0].length;
  var cn = document.createElement('canvas');
  cn.width = w; cn.height = h;
  var c = cn.getContext('2d');
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var ch = rows[y].charAt(x);
      if (ch === '.') continue;
      if (swap && swap[ch]) ch = swap[ch];
      c.fillStyle = PAL[ch] || '#FF00FF';
      c.fillRect(x, y, 1, 1);
    }
  }
  return cn;
}

var SPR = {};
for (var key in ART) { if (ART.hasOwnProperty(key)) SPR[key] = bake(ART[key]); }

function put(name, x, y) {
  var s = SPR[name];
  if (s) ctx.drawImage(s, x | 0, y | 0);
}

/* Texto con la tipografia de 5x7, con sombra opcional. */
function text(c, s, x, y, col, scale, shadow) {
  s = String(s).toUpperCase();
  scale = scale || 1;
  var cx = x, i, g, cells, gy, gx;
  for (i = 0; i < s.length; i++) {
    g = FONT[s.charAt(i)];
    if (!g) { cx += 6 * scale; continue; }
    cells = g.split(' ');
    if (shadow) {
      for (gy = 0; gy < 7; gy++) for (gx = 0; gx < 5; gx++)
        if (cells[gy].charAt(gx) === '1')
          rect(c, cx + gx * scale + scale, y + gy * scale + scale, scale, scale, shadow);
    }
    for (gy = 0; gy < 7; gy++) for (gx = 0; gx < 5; gx++)
      if (cells[gy].charAt(gx) === '1')
        rect(c, cx + gx * scale, y + gy * scale, scale, scale, col);
    cx += 6 * scale;
  }
  return cx;
}
function textWidth(s, scale) { return String(s).length * 6 * (scale || 1) - (scale || 1); }

/* Deja un texto ya pintado en su propio canvas. Repintar letra por
   letra en cada cuadro seria tirar trabajo a la basura 60 veces por
   segundo: mejor lo horneamos una vez y luego solo lo copiamos. */
function bakeText(s, col, scale, shadow) {
  scale = scale || 1;
  var cn = document.createElement('canvas');
  cn.width = textWidth(s, scale) + scale;
  cn.height = 7 * scale + scale;
  text(cn.getContext('2d'), s, 0, 0, col, scale, shadow);
  return cn;
}

/* ------------------------------------------------- 5. EL FONDO
   Cielo, montanas, gruas, edificio, suelo y los objetos quietos.
   Se pinta una sola vez en un canvas aparte. */
var bgcv = document.createElement('canvas');
bgcv.width = W; bgcv.height = H;
var bg = bgcv.getContext('2d');

function mast(c, x, y, h, w, col, light) {
  rect(c, x, y, 1, h, col);
  rect(c, x + w - 1, y, 1, h, col);
  var inner = w - 2, j, k;
  for (j = 0; j < h; j++) {
    if (j % 6 === 0) { rect(c, x, y + j, w, 1, col); }
    else {
      k = (j % 6) - 1;
      px(c, x + 1 + (k % inner), y + j, light);
      px(c, x + w - 2 - (k % inner), y + j, light);
    }
  }
}

function truss(c, x, y, w, h, col, light) {
  rect(c, x, y, w, 1, col);
  rect(c, x, y + h - 1, w, 1, col);
  var span = 2 * (h - 2), i, k, d;
  for (i = 0; i < w; i++) {
    k = i % span;
    d = k < h - 2 ? k : span - k;
    px(c, x + i, y + 1 + d, light);
  }
  for (i = 0; i < w; i += 8) rect(c, x + i, y, 1, h, col);
}

function ridge(c, pts, col, topCol) {
  for (var i = 0; i < pts.length - 1; i++) {
    var x0 = pts[i][0], y0 = pts[i][1], x1 = pts[i + 1][0], y1 = pts[i + 1][1];
    for (var x = x0; x < x1; x++) {
      var y = Math.round(y0 + (y1 - y0) * (x - x0) / (x1 - x0));
      px(c, x, y, topCol);
      rect(c, x, y + 1, 1, GROUND - y - 1, col);
    }
  }
}

/* ------------------------------------------------- 6. SONIDO
   Mismo truco que en el resto del sitio: nada de archivos,
   solo osciladores. Arranca apagado porque el navegador exige
   un clic antes de dejar sonar algo. */
var soundOn = false;
var actx = null, master = null;
/* Si el audio del navegador se porta mal, se apaga solo y el dibujo
   sigue caminando. Antes una falla de sonido congelaba la animacion. */
var soundBroken = false;
var soundTries = 0;
var lastSfx = 0;

function soundFailed(e) {
  soundBroken = true;
  soundOn = false;
  try {
    var b = document.getElementById('soundToggle');
    b.textContent = 'SOUND: OFF';
    b.setAttribute('aria-pressed', 'false');
  } catch (e2) {}
  try { say('sound quit on me, the cats are fine'); } catch (e2) {}
  if (window.console && console.warn) console.warn('lqcorner audio:', e);
}

/* Envuelve un efecto: nunca deja que una falla de audio salga de aqui,
   y le pone freno para que no se apilen mil sonidos de un jalon. */
function guard(fn) {
  return function () {
    if (!soundOn || soundBroken) return;
    var n = Date.now();
    if (n - lastSfx < 45) return;
    lastSfx = n;
    try { fn.apply(null, arguments); } catch (e) { soundFailed(e); }
  };
}

function audio() {
  if (!actx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.22;
    master.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function tone(type, freq, dur, vol, glideTo, filterHz) {
  if (!soundOn || soundBroken || !audio()) return;
  var t0 = actx.currentTime;
  var osc = actx.createOscillator();
  var g = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  var last = g;
  if (filterHz) {
    var f = actx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = filterHz;
    g.connect(f); last = f;
  }
  osc.connect(g); last.connect(master);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

function noise(dur, vol, hz, q) {
  if (!soundOn || soundBroken || !audio()) return;
  var t0 = actx.currentTime;
  var n = Math.floor(actx.sampleRate * dur);
  var buf = actx.createBuffer(1, n, actx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = actx.createBufferSource();
  src.buffer = buf;
  var f = actx.createBiquadFilter();
  /* Q es un AudioParam: se le escribe .value, no el numero pelado.
     Asignarle directo truena en Firefox y en Safari. */
  f.type = 'bandpass';
  f.frequency.value = hz;
  f.Q.value = q || 1;
  var g = actx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0);
}

/* martillazo: golpe seco mas resonancia metalica */

/* la alarma de reversa del camion */
var sfxBeeps = guard(function () {
  for (var i = 0; i < 3; i++)
    setTimeout(function () {
      try { tone('square', 1000, 0.1, 0.05); } catch (e) { soundFailed(e); }
    }, i * 230);
});
/* maullido: dos deslizamientos de tono, uno distinto para cada gato */

  tone('triangle', base * 0.75, 0.13, 0.13, base * 1.15);
  setTimeout(function () {
    try {
      tone('sawtooth', base * 1.1, 0.26, 0.07, base * 0.62, 2200);
    } catch (e) { soundFailed(e); }
  }, 110);
});
/* el gancho al recibir un zarpazo */
var sfxClang = guard(function () {
  tone('square', 1500, 0.22, 0.05, 700);
  tone('triangle', 900, 0.3, 0.05, 420);
});
/* chispa del soldador */
var sfxSpark = guard(function () { noise(0.12, 0.16, 5200, 0.7); });

/* Ruido de obra cada tanto, solo si el sonido esta prendido. */
function ambience() {
  var wait = 2600 + Math.random() * 4200;
  setTimeout(function () {
    if (soundOn && !soundBroken) {
      var r = Math.random();
      if (r < 0.45) sfxHammer();
      else if (r < 0.75) sfxDrill();
      else sfxBeeps();
    }
    ambience();
  }, wait);
}
ambience();

var toggle = document.getElementById('soundToggle');
toggle.addEventListener('click', function () {
  soundOn = !soundOn;
  this.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
  this.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  /* Si el sonido se habia caido, le damos otra oportunidad: puede haber
     sido algo de una sola vez. Tras tres intentos ya lo dejamos en paz. */
  if (soundOn && soundBroken && soundTries < 3) {
    soundBroken = false;
    soundTries++;
  }
  if (soundOn && soundBroken) {
    soundOn = false;
    this.textContent = 'SOUND: OFF';
    say('sound is not working in this browser, sorry');
    return;
  }
  if (soundOn) {
    try { audio(); tone('square', 880, 0.07, 0.05); }
    catch (e) { soundFailed(e); }
  }
  try { localStorage.setItem('lqcorner-sound', soundOn ? '1' : '0'); } catch (e) {}
});

function frameAt(t) {
  var step = Math.floor(t / 130);          /* paso de animacion, ~7.7 fps */

  ctx.drawImage(bgcv, 0, 0);

  /* --- pajaros cruzando el cielo --- */

    var bx = ((t / 70 + i * 90) % (W + 40)) - 20;
    var by = 20 + i * 9 + Math.sin(t / 900 + i) * 2;
    var up = (step + i) % 2 === 0;
    px(ctx, bx, by, '#2B3A44');
    px(ctx, bx - 1, by + (up ? -1 : 1), '#2B3A44');
    px(ctx, bx + 1, by + (up ? -1 : 1), '#2B3A44');
  }

  /* --- el soldador del edificio suelta chispas --- */
  if (t - lastSpark > 3400 + Math.sin(t / 1000) * 600) {
    lastSpark = t;
    sfxSpark();
    for (i = 0; i < 9; i++)
      sparks.push({ x: 154, y: 74, vx: (Math.random() - 0.5) * 1.6,
                    vy: Math.random() * 0.9, life: 300 + Math.random() * 300, t: 0 });
  }
  if (t - lastSpark < 130) rect(ctx, 152, 72, 4, 4, '#FFF9D8');
  for (i = sparks.length - 1; i >= 0; i--) {
    s = sparks[i];
    s.t += 16;
    if (s.t > s.life) { sparks.splice(i, 1); continue; }
    px(ctx, s.x + s.vx * s.t / 16, s.y + s.vy * s.t / 16 + 0.008 * s.t,
       s.t < s.life / 2 ? '#FFF3B0' : '#F7C543');
  }

  /* --- gancho colgando como juguete de gato --- */
  var swing = Math.sin(t / 820) * 5 + Math.sin(t / 310) * hook.kick;
  hook.kick *= 0.985;
  hook.x = TROLLEY - 3 + swing;
  hook.y = 104 + Math.cos(t / 1100) * 1.5;
  line(ctx, TROLLEY, 49, hook.x + 3, hook.y + 1, '#241820');
  put('HOOK', hook.x, hook.y);

  /* --- gato dormido: respira, ronca sus Z y trae el casco encima --- */
  var sl = cats[0];
  /* los dos cuadros ya traen el lomo a distinta altura: respira sola */
  var breathe = (step % 8) < 4 ? 'CAT3_A' : 'CAT3_B';
  var sly = sl.y - sl.hop;
  put(breathe, sl.x, sly);
  put('HAT', sl.x + 9, sly + 5);
  /* las Z salen de la cabeza, que le queda del lado derecho */
  for (i = 0; i < 2; i++) {
    var zt = ((t / 24 + i * 60) % 120);
    if (zt < 100) {
      var zy = sly - 5 - zt * 0.22;
      var zx = sl.x + 34 + zt * 0.05 + Math.sin(zt / 12) * 1.5;
      ctx.drawImage(zt > 75 ? zSoft : zLoud, zx | 0, zy | 0);
    }
  }

  /* --- gato de en medio: se estira y manotea el gancho --- */
  var jp = cats[1];
  var reach = Math.sin(t / 820 + 0.35);          /* sincronizado con el gancho */
  var jh = jp.hop;
  var swipe = Math.round((reach + 1) * 3);       /* 0 a 6 pixeles de estirada */
  /* La colita se queda quieta en el piso, pegada a la base. La patita
     del otro lado va doblada en el cuerpo: se le ven las dos. */
  put('TAIL2', 86, BASE - 6);
  put('CAT2', 96, BASE - 14 - jh);
  /* La cubeta le tapa toda la cabeza: nada de ojos ni trompa. Aun asi
     se ladea con el columpio del gancho, como si adentro estuviera
     girando la cabeza para oir donde anda el juguete. */
  put('BUCKET', 94 + (swing > 1 ? 1 : (swing < -1 ? -1 : 0)),
      107 - jh + (swipe >= 5 ? -1 : 0));
  /* Solo una patita se estira, y va encima de la cubeta: manotea a
     ciegas, que es justo el chiste. */
  var armY = 120 - swipe - jh;
  put('ARM_UP', 108, armY);
  /* si el zarpazo coincide con el gancho, suena y salta una chispita */
  if (swipe >= 6 && swing < 1.5 && t - lastHammerDust > 900) {
    lastHammerDust = t;
    sfxClang();
    hook.kick = Math.min(hook.kick + 1.8, 5);
    for (i = 0; i < 3; i++)
      puffs.push({ x: 116, y: armY, vx: (Math.random() - .5), vy: -.3, t: 0, life: 400 });
  }

  /* --- gato del barril: cola de vaiven y ojo vigilante --- */
  var bs = cats[2];
  var by2 = bs.y - bs.hop;
  /* La cola va de un lado al otro del barril. El seno hace que se
     detenga en los extremos y cruce rapido por detras del barril. */
  var sway = Math.round(2 + 2 * Math.sin(t / 1150));
  put('SWAY' + sway, 187, by2 + 24);
  put('BARREL', 198, BASE - 17);
  put('CAT1', bs.x, by2);
  if (blink1 > 0) {
    blink1 -= 16;
    rect(ctx, 200, by2 + 14, 2, 2, PAL.o);
    rect(ctx, 210, by2 + 14, 2, 2, PAL.o);
    rect(ctx, 200, by2 + 15, 2, 1, PAL.k);
    rect(ctx, 210, by2 + 15, 2, 1, PAL.k);
  } else if (Math.random() < 0.005) blink1 = 140;

  /* --- ojitos en la caja de carton, de vez en cuando --- */
  if (boxEyes <= 0 && Math.random() < 0.0013) boxEyes = 1800;
  if (boxEyes > 0) {
    boxEyes -= 16;
    if (boxEyes > 200 || (Math.floor(boxEyes / 100) % 2 === 0)) {
      rect(ctx, 154, BASE - 10, 2, 2, '#8FC46A');
      rect(ctx, 158, BASE - 10, 2, 2, '#8FC46A');
    }
  }

  /* --- polvito --- */
  for (i = puffs.length - 1; i >= 0; i--) {
    p = puffs[i];
    p.t += 16;
    if (p.t > p.life) { puffs.splice(i, 1); continue; }
    px(ctx, p.x + p.vx * p.t / 16, p.y + p.vy * p.t / 16, '#C7B49E');
  }

  /* --- brinquitos al hacerles clic --- */
  for (i = 0; i < cats.length; i++) if (cats[i].hop > 0) cats[i].hop -= 0.5;

  /* --- cinta de obra corriendo abajo --- */
  ctx.drawImage(tapeCv, -(Math.floor(t / 60) % 10), H - 6);
  rect(ctx, 0, H - 7, W, 1, '#0B0B0B');
  rect(ctx, 0, H - 1, W, 1, '#0B0B0B');

  /* --- titulo, con un parpadeo lento --- */
  ctx.drawImage((Math.floor(t / 620) % 6) !== 0 ? titleCream : titleGold, titleX, 6);
  var k = Math.floor(t / 4200) % SUBS.length;
  ctx.drawImage(subCv[k], subX[k], 24);
}

/* ------------------------------------------------- 9. BUCLE */
var t0 = 0, tPrev = -999, frameErrors = 0;
function loop(now) {
  if (!t0) t0 = now;
  /* 33 ms entre cuadros: 30 por segundo alcanzan de sobra para
     pixel art y no calientan el telefono. */
  if (now - tPrev >= 33) {
    tPrev = now;
    /* Cada cuadro va aparte. Si uno truena no se lleva la animacion
       entre las patas: antes eso dejaba la obra pintada y sin gatos. */
    try {
      frameAt(now - t0);
    } catch (e) {
      frameErrors++;
      if (window.console && console.warn) console.warn('lqcorner frame:', e);
      if (frameErrors === 1) soundFailed(e);
      if (frameErrors > 40) return;          /* ya fue, dejamos el ultimo */
    }
  }
  requestAnimationFrame(loop);
}
if (reduce) {
  try { frameAt(1500); } catch (e) {}
} else {
  requestAnimationFrame(loop);
}

/* Cualquier otro tropiezo (un clic, un temporizador) apaga el sonido y
   deja el aviso en la pantallita, en lugar de dejar la pagina muerta. */
window.onerror = function (msg) {
  if (!soundBroken) soundFailed(msg);
  return false;
};

/* ------------------------------------------------- 10. CLICS
   Convertimos la posicion del mouse al sistema de 256x144. */
function hit(ev) {
  var r = cv.getBoundingClientRect();
  var pt = ev.touches ? ev.touches[0] : ev;
  var lx = (pt.clientX - r.left) * W / r.width;
  var ly = (pt.clientY - r.top) * H / r.height;
  var i, c;

  for (i = 0; i < cats.length; i++) {
    c = cats[i];
    if (lx >= c.x && lx <= c.x + c.w && ly >= c.y && ly <= c.y + c.h) {
      try { audio(); sfxMeow(c.meow); } catch (e) { soundFailed(e); }
      c.hop = 4;
      meows++;
      document.getElementById('meowcount').textContent = 'meows: ' + meows;
      if (meows === 10) say('ten meows. they are not going to work faster.');
      for (var j = 0; j < 4; j++)
        puffs.push({ x: c.x + c.w / 2 + (Math.random() - .5) * 8, y: c.y + c.h - 1,
                     vx: (Math.random() - .5) * .8, vy: -.25, t: 0, life: 500 });
      return;
    }
  }
  if (lx >= hook.x - 2 && lx <= hook.x + 10 && ly >= hook.y - 2 && ly <= hook.y + 14) {
    try { audio(); sfxClang(); } catch (e) { soundFailed(e); }
    hook.kick = 5;
    return;
  }
  try { audio(); tone('square', 240, 0.05, 0.03); } catch (e) { soundFailed(e); }
}
cv.addEventListener('click', hit);
cv.addEventListener('touchstart', function (e) { e.preventDefault(); hit(e); }, { passive: false });

/* ------------------------------------------------- 11. HUD
   Barra de avance que sube, se atora y se reinicia. */
var fill = document.getElementById('barfill');
var wrap = document.getElementById('barwrap');
var readout = document.getElementById('readout');
var LINES = [
  ['> laying cables_', 3],
  ['> cat found the cables_', 11],
  ['> re-laying cables_', 7],
  ['> pouring the blog section_', 24],
  ['> cat asleep on the blog section_', 31],
  ['> hauling photos up with the crane_', 48],
  ['> crane hook reclassified as a toy_', 44],
  ['> writing about the cats instead_', 66],
  ['> coffee break (mine)_', 71],
  ['> nap (theirs)_', 71],
  ['> almost_', 92],
  ['> starting over, honestly_', 4]
];
var li = 0;

function say(msg) {
  readout.innerHTML = '&gt; ' + msg + '_';
}

function tick() {
  var row = LINES[li % LINES.length];
  readout.innerHTML = row[0].replace('>', '&gt;');
  fill.style.width = row[1] + '%';
  wrap.setAttribute('aria-valuenow', row[1]);
  li++;
  setTimeout(tick, 3600);
}
tick();

/* Si en otra pagina ya habias prendido el sonido, aqui te lo
   recordamos con el aviso, pero no suena hasta que hagas clic:
   los navegadores no dejan audio sin un gesto tuyo.
   Si en index.html usas otra llave de localStorage, cambiala aqui. */
try {
  if (localStorage.getItem('lqcorner-sound') === '1')
    say('sound is off until you click the button');
} catch (e) {}

})();
</script>
