<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · File not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet">
  <style>
    :root { --phosphor: #00FF41; --phosphor-dim: #00A82D; --amber: #FFB000; }
    html { cursor: url('/assets/ui/cursors/cursor-arrow.png') 0 0, default; }
    a { cursor: url('/assets/ui/cursors/cursor-hand.png') 10 0, pointer; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: var(--phosphor);
      font-family: 'VT323', "Courier New", monospace;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      box-sizing: border-box;
      text-shadow: 0 0 6px rgba(0,255,65,0.45);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.25) 3px, rgba(0,0,0,0.25) 4px);
      opacity: 0.5;
    }
    main { max-width: 760px; }
    h1 { font-size: clamp(2rem, 7vw, 3.4rem); margin: 0 0 18px; font-weight: normal; letter-spacing: 2px; }
    p { margin: 0 0 12px; color: var(--phosphor-dim); }
    a { color: var(--phosphor); }
    a:hover, a:focus-visible { color: var(--amber); }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>ERROR 404: FILE NOT FOUND<span class="caret">█</span></h1>
    <p>C:\&gt; the file you asked for is not on this disk.</p>
    <p>It may have moved when the site left Neocities for GitHub Pages.</p>
    <p>Abort, Retry, <a href="/">Portal</a>?</p>
    <p>&gt; <a href="/professional.html">professional_log.exe</a> &nbsp; &gt; <a href="/cv.html">cv.html</a></p>
  </main>
</body>
</html>
